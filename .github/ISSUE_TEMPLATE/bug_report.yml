name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Helios"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.
        If this is a security vulnerability, please refer to [SECURITY.md](https://github.com/brazaoo4/helios/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the problem is."
      placeholder: "e.g., Calling recall_memories with a specific scope causes..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps or MCP tool calls to reproduce the behavior."
      placeholder: |
        1. Start Helios container with...
        2. Execute tool call `save_memory(...)`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: dropdown
    id: mcp_client
    attributes:
      label: "MCP Client"
      description: "Which client or IDE are you connecting to Helios with?"
      options:
        - "Antigravity CLI / IDE"
        - "Cursor"
        - "Claude Desktop"
        - "Claude Code"
        - "Other MCP Client"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: "MCP Transport Protocol"
      description: "Which protocol endpoint is in use?"
      options:
        - "Streamable HTTP (/mcp)"
        - "Server-Sent Events (/sse)"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: deployment_mode
    attributes:
      label: "Deployment Mode"
      description: "How is Helios running?"
      options:
        - "Docker Compose"
        - "Dockhand / Portainer"
        - "Kubernetes / GitOps"
        - "Bare-metal Python"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Server Logs"
      description: "Attach server output (e.g., `docker logs --tail=50 helios`). Please redact any private keys."
      render: shell
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Any other details, OS platform, reverse proxy setup, or environment nuances."
