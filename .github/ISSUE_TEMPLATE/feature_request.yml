name: "💡 Feature Request"
description: "Suggest an idea or enhancement for Helios"
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Helios focuses on strict token budgets, high retrieval speed, and drift prevention.
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Limitation"
      description: "Is this related to a specific workflow friction or missing capability?"
      placeholder: "I find that when working across..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the tool, API endpoint, or behavior you would like added."
    validations:
      required: true
  - type: textarea
    id: token_impact
    attributes:
      label: "Token Budget & Agent Impact"
      description: "How does this feature affect agent context window usage and retrieval efficiency?"
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or existing tools you've evaluated."
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Any mockups, diagrams, or links to relevant MCP specifications."
