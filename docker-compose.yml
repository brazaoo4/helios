services:
  helios:
    build: .
    image: ${HELIOS_IMAGE:-ghcr.io/brazaoo4/helios:latest}
    container_name: helios
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
      - MEMORY_DATA_DIR=/data
      - HELIOS_API_KEY=${HELIOS_API_KEY:-}
      - HELIOS_WEBHOOK_SECRET=${HELIOS_WEBHOOK_SECRET:-}
      - HELIOS_REQUIRE_WEBHOOK_SECRET=${HELIOS_REQUIRE_WEBHOOK_SECRET:-false}
      - HELIOS_PUBLIC_URL=${HELIOS_PUBLIC_URL:-}
      - HELIOS_GIT_PROVIDER=${HELIOS_GIT_PROVIDER:-}
      - HELIOS_GIT_API_URL=${HELIOS_GIT_API_URL:-}
      - HELIOS_GIT_TOKEN=${HELIOS_GIT_TOKEN:-}
      - HELIOS_GIT_OWNER=${HELIOS_GIT_OWNER:-}
      - HELIOS_WEBHOOK_URL=${HELIOS_WEBHOOK_URL:-}
    volumes:
      - ${HELIOS_DATA_PATH:-./data}:/data
    ports:
      - "${HELIOS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
