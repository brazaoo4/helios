services:
  helios:
    build: .
    image: helios:latest
    container_name: helios
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - MEMORY_DATA_DIR=${MEMORY_DATA_DIR:-/data}
      - HELIOS_API_KEY=${HELIOS_API_KEY:-}
      - HELIOS_WEBHOOK_SECRET=${HELIOS_WEBHOOK_SECRET:-}
      - HELIOS_WORD_LIMIT=${HELIOS_WORD_LIMIT:-25}
      - HELIOS_EPISODIC_TTL_DAYS=${HELIOS_EPISODIC_TTL_DAYS:-14}
      - HELIOS_CHANGELOG_LIMIT=${HELIOS_CHANGELOG_LIMIT:-100}
      - HELIOS_ALLOWED_ORIGINS=${HELIOS_ALLOWED_ORIGINS:-*}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
